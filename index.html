<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unicornial-charts playground</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #fafafa; }
      header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
      h1 { font-size: 20px; margin: 0; }
      #app { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; }
      .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px; }
      .card h2 { font-size: 14px; margin: 4px 8px; color: #555; }
      .wrap { position: relative; }
      canvas.chart { display: block; width: 100%; height: 300px; }
    </style>
  </head>
  <body>
    <header>
      <h1>unicornial-charts</h1>
      <button id="randomize">Randomize data</button>
      <span id="log">Click a data point…</span>
    </header>
    <div id="app"></div>
    <script type="module" src="/playground/main.ts"></script>
  </body>
</html>
